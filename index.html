
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rice Crop Production Prediction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eaf2e3;
            text-align: center;
            padding: 40px 15px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 430px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 10px #aaa;
        }

        h2 {
            color: green;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            margin: 15px 0 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: green;
            color: white;
            padding: 12px 25px;
            width: 100%;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: darkgreen;
        }

        #result {
            margin-top: 20px;
            font-weight: bold;
            color: green;
        }

        #error {
            color: red;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Rice Crop Production Prediction</h2>

    <form id="predictionForm">

        <label>Select Model</label>

        <select id="model">
            <option value="simple_model">
                Simple Linear Regression
            </option>
        </select>

        <label>Enter Hectares</label>

        <input
            type="number"
            id="hectares"
            placeholder="Enter Hectares"
            step="any"
            min="0.01"
            required
        >

        <button type="submit" id="predictBtn">
            Predict
        </button>

    </form>

    <p id="result"></p>
    <p id="error"></p>

</div>

<script>

const API_URL =
"https://rice-crop-pridiction.onrender.com/predict";

document.getElementById("predictionForm")
.addEventListener("submit", async function(event) {

    event.preventDefault();

    const hectares =
        Number(document.getElementById("hectares").value);

    const model =
        document.getElementById("model").value;

    const result =
        document.getElementById("result");

    const error =
        document.getElementById("error");

    const button =
        document.getElementById("predictBtn");

    result.innerHTML = "";
    error.innerHTML = "";

    if (!Number.isFinite(hectares) || hectares <= 0) {
        error.innerHTML = "Please enter valid hectares.";
        return;
    }

    button.disabled = true;
    button.innerHTML = "Predicting...";

    try {

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                model_name: model,

                features: {
                    Hectares: hectares
                }

            })

        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(
                JSON.stringify(data.detail || data)
            );
        }

        result.innerHTML =
            "Predicted Paddy Yield: " +
            Number(data.predicted_paddy_yield_kg).toFixed(2) +
            " Kg";

    }

    catch (err) {

        error.innerHTML =
            "Prediction Error: " + err.message;

    }

    finally {

        button.disabled = false;
        button.innerHTML = "Predict";

    }

});

</script>

</body>
</html>
